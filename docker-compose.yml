services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/trustcare}
      - JWT_SECRET=${JWT_SECRET:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://ml:8000}
      - ML_SERVICE_TOKEN=${ML_SERVICE_TOKEN:-}
      - ML_TIMEOUT_MS=${ML_TIMEOUT_MS:-800}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy

  ml:
    build:
      context: ./ml-service
    ports:
      - "${ML_PORT:-8000}:8000"
    environment:
      - CARE_RANKER_MODEL_PATH=${CARE_RANKER_MODEL_PATH:-models/care_ranker.joblib}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
