name: ML + Recommendations CI

on:
  push:
    paths:
      - "ml-service/**"
      - "backend/src/services/**"
      - "backend/src/validators/**"
      - "backend/src/routes/recommendations.ts"
      - "backend/test_recommendations.ts"
      - ".github/workflows/ml.yml"
  pull_request:
    paths:
      - "ml-service/**"
      - "backend/src/services/**"
      - "backend/src/validators/**"
      - "backend/src/routes/recommendations.ts"
      - "backend/test_recommendations.ts"
      - ".github/workflows/ml.yml"

jobs:
  ml-service:
    name: ML service (train + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build + validate dataset
        run: |
          python training/build_dataset.py
          python training/validate_data.py
      - name: Train and evaluate
        run: |
          python training/train.py
          python training/evaluate.py
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Upload evaluation metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation
          path: docs/model-evaluation.json
          if-no-files-found: warn

  backend-recommendations:
    name: Backend (fallback + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Recommendation fallback tests (ML disabled)
        run: npm run test:recommend

  integration:
    name: Backend ↔ ML integration
    runs-on: ubuntu-latest
    needs: [ml-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install ML dependencies + build model
        run: |
          pip install -r ml-service/requirements.txt
          python ml-service/training/build_dataset.py
          python ml-service/training/train.py
      - name: Start ML service
        run: |
          cd ml-service
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/ml.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ready > /dev/null; then echo "ML service ready"; exit 0; fi
            sleep 1
          done
          echo "ML service did not become ready"; cat /tmp/ml.log; exit 1
      - name: Backend integration tests (ML enabled)
        run: |
          cd backend
          npm ci
          ML_SERVICE_URL=http://127.0.0.1:8000 ML_TIMEOUT_MS=1500 npm run test:recommend
