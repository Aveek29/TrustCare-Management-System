services:
  - type: web
    name: trustcare-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm ci --ignore-scripts && npm run build
    startCommand: cd backend && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ML_SERVICE_URL
        sync: false
      - key: ML_SERVICE_TOKEN
        sync: false
      - key: ML_TIMEOUT_MS
        sync: false

  - type: web
    name: trustcare-ml
    env: python
    region: singapore
    plan: free
    buildCommand: pip install --disable-pip-version-check -r ml-service/requirements.txt && python ml-service/training/build_dataset.py && python ml-service/training/train.py
    startCommand: cd ml-service && uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /health
    envVars:
      - key: CARE_RANKER_MODEL_PATH
        value: models/care_ranker.joblib

  - type: web
    name: trustcare-frontend
    env: node
    region: singapore
    plan: free
    buildCommand: cd frontend && npm ci --ignore-scripts && npm run build
    startCommand: cd frontend && node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://trustcare-backend.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
